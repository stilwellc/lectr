# One-shot data heal: excise the idwalk-minted NFL Auction "sales" whose
# prices were scraped off the archived pages' Hot-Items sidebar widget
# (3,895 rows sharing a handful of widget prices — $10,050 x3,622 — 70% of
# the NFL sold corpus, poisoning every game-used comp). True prices are
# unrecoverable; rows are excised by their idwalk signature (synthetic
# day-15 saleDate + no image). Idempotent; safe to re-run.
name: NFL Auction heal (idwalk excision)
on:
  workflow_dispatch: {}
concurrency:
  group: segments-nflauction
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Pull the nflauction segment from R2
        run: bash scripts/data-store.sh pull-segment nflauction
      - name: Heal (dry run first, then write)
        run: |
          npx tsx scripts/heal-nflauction-idwalk.ts
          npx tsx scripts/heal-nflauction-idwalk.ts --write
      - name: Push the healed segment
        run: bash scripts/data-store.sh push-segment nflauction
