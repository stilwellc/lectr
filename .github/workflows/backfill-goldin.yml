# Goldin PER-AUCTION HISTORY backfill (2012–2022). The goldin segment starts
# in 2023, but Goldin's auctions API lists every Completed auction back to
# 2012 and the per-auction sold query (§3b of scripts/lib/houses/goldin.ts —
# the nightly's own recent-close sweep) serves each one's full realized list:
# ~123k sold lots before 2023 (2019 6.9k · 2020 10.3k · 2021 30.5k · 2022
# 41.5k), no auction above 3.7k (well under the 10k Algolia window).
#
# The crawl is the nightly's path (ray-crawl.ts, RAY_HOUSE=goldin) in
# SWEEP-ONLY mode: live passes + the archive tail are skipped, nothing is
# promoted or evicted, and only Completed auctions ending inside [from, to)
# are swept. The result is unioned back over the pre-crawl snapshot (fresh id
# wins, a dropped pre id is restored — nothing evicted); NEW rows of the
# skip_artists slugs are left out (default sports-cards,pokemon: the card
# pricer only reads ≤1y sales, so pre-2023 cards are bulk without value).
# Dispatch-only, sliced by date window; dry_run (the default) crawls and
# reports new rows by category + the push-gate verdict without pushing.
name: Backfill Goldin (per-auction history)
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'sweep auctions ending on/after this day (YYYY-MM-DD)'
        default: '2022-01-01'
      to:
        description: 'sweep auctions ending BEFORE this day (YYYY-MM-DD, exclusive; ≤ 2023-01-01 — the segment already holds 2023+)'
        default: '2023-01-01'
      skip_artists:
        description: 'comma list of slugs whose NEW rows are left out ('''' = keep everything)'
        default: 'sports-cards,pokemon'
      dry_run:
        description: 'crawl + report counts (and the push gate verdict) WITHOUT pushing the segment'
        type: boolean
        default: true
      skip_gate:
        description: 'set SEGMENT_SHRINK_OK=1 on push — ONLY after a dry run showed the gate blocking on a price-band shift from legitimate growth'
        type: boolean
        default: false
# SEGMENT LOCK: the same per-house group nightly.yml's crawl matrix uses, so a
# pull → crawl → union → push here can never interleave with another writer's.
concurrency:
  group: segments-goldin
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    # measured locally: one month (2 auctions, 4.8k sold) = 49 pages, 84s incl.
    # the 385k-row segment load/write; a full year (2022) ≈ 420 pages ≈ 15 min
    timeout-minutes: 120
    env:
      # the goldin segment is ~1GB of NDJSON; the nightly leg runs at 10GB too
      NODE_OPTIONS: --max-old-space-size=10240
      FROM: ${{ inputs.from || '2022-01-01' }}
      TO: ${{ inputs.to || '2023-01-01' }}
      SKIP_ARTISTS: ${{ inputs.skip_artists }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # a malformed date or a window reaching into 2023+ (already in the
      # segment, and the nightly's own territory) fails the dispatch
      - name: Validate inputs
        run: |
          for v in FROM TO; do
            if ! [[ "${!v}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "${!v}" +%F >/dev/null 2>&1; then echo "::error::$v must be a real YYYY-MM-DD day"; exit 1; fi
          done
          [[ "$FROM" < "$TO" ]] || { echo "::error::from ($FROM) must be before to ($TO)"; exit 1; }
          if [[ "$TO" > "2023-01-01" ]]; then echo "::error::to must be ≤ 2023-01-01 (2023+ is already in the segment)"; exit 1; fi
          [[ "$SKIP_ARTISTS" =~ ^[a-z0-9,-]*$ ]] || { echo "::error::skip_artists must be a comma list of slugs"; exit 1; }
          echo "- window \`$FROM\` → \`$TO\` · skip new \`${SKIP_ARTISTS:-none}\` · dry_run ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
      # STRICT pull (no `|| echo` fallback): a failed pull followed by a
      # union-and-push would publish a crawl-only segment over the real one.
      - name: Pull last-good segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment goldin
      - name: Snapshot the pre-crawl segment
        run: |
          f=data/corpus/segments/goldin.ndjson.gz
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/goldin.pre.ndjson.gz"; else echo "::error::no goldin segment pulled — a history backfill never bootstraps the segment"; exit 1; fi
      # 400ms between pages (goldinQuery callers); a failed auction page throws
      # in SWEEP-ONLY mode, so a 403/5xx wall stops the run before any write
      - name: Sweep Goldin sold history
        timeout-minutes: 90
        env:
          RAY_HOUSE: goldin
          RAY_GOLDIN_SWEEP_ONLY: '1'
          RAY_GOLDIN_SWEEP_FROM: ${{ env.FROM }}
          RAY_GOLDIN_SWEEP_TO: ${{ env.TO }}
        run: npx tsx scripts/ray-crawl.ts
      - name: Union over the snapshot (nothing evicted) + report
        run: npx tsx scripts/backfill-segment.ts union --house goldin --pre "$RUNNER_TEMP/goldin.pre.ndjson.gz" --skip-artists "$SKIP_ARTISTS" --write
      # dry run: what push-segment's per-house shrink/price gate WOULD say
      - name: Push-gate preview (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          stats=data/corpus/segments/.goldin.pulled-stats.json
          echo "- segment size: $(wc -c < data/corpus/segments/goldin.ndjson.gz | tr -d ' ') bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$stats" ]; then echo "- push gate: no baseline stats — would pass" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          rc=0; npx tsx scripts/ci/segment-gate.ts check goldin "$stats" data/corpus/segments/goldin.ndjson.gz || rc=$?
          case "$rc" in
            0) echo "- push gate: PASS" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::warning title=push gate would block::see data/qa/leg-health-gate.json in the log above"; echo "- push gate: WOULD BLOCK (skip_gate=true overrides once verified)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "- push gate: tool error rc $rc" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          echo "- DRY RUN — segment NOT pushed" >> "$GITHUB_STEP_SUMMARY"
      - name: Push segment
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEGMENT_SHRINK_OK: ${{ inputs.skip_gate && '1' || '0' }}
        run: bash scripts/data-store.sh push-segment goldin
