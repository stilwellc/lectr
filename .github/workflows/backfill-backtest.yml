# One-off (re-runnable) FULL backtest replay: pulls the corpus + served
# payloads from R2, re-scores every concluded-with-estimate lot from scratch
# (rebuilding the sidecar accumulator with every current calObs field), and
# pushes backtest.json + state. Exists because the weekly Sunday full-rebuild
# backstop can be lost to a cancelled run — after which weekday incrementals
# carry a stale-shaped state for weeks (byMarket shipped n:0 for 12 days).
name: Backfill backtest (full replay)
on:
  workflow_dispatch:
concurrency:
  group: backfill-backtest
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    # the full replay walks every graded call against the 1.1M-lot corpus —
    # the first attempt died at 120m with nothing pushed; give it real room
    timeout-minutes: 330
    env:
      # without this the replay ran on node's ~4GB default heap and
      # GC-thrashed to a standstill at ~180K/273K
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull corpus + served payloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull
      - name: Full replay
        run: npx tsx scripts/build-backtest.ts
      - name: Push backtest.json + accumulator state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-backtest
