# One-off (re-runnable) REA archive back-crawl over an itemid WINDOW. Built to
# recover REA Summer 2026 (ids 185118..195743, ~10K lots) — lost Sep 2026 when
# the live leg read a 200 grid with zero parseable lots as "the sale is empty"
# and evicted every upcoming row before its resolve could settle them (see
# crawlReaLive in scripts/crawl-rea.ts for the earned-ok gate that replaced it).
# A closed lot's bid.collectrea.com/lots/{id} 302s to the collectrea.com
# archive page; getHtml follows it and parseReaLot reads <dt>Sold For</dt>.
# Unions into the rea segment on R2 (fresh id wins, nothing is evicted);
# tonight's assemble picks it up. Dispatch-only. ~10.6K ids at 4-way / 150ms
# ≈ 20–30 min.
name: Backfill REA (archive id window)
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'first itemid (REA Summer 2026 starts at 185118)'
        default: '185118'
      end:
        description: 'last itemid (REA Summer 2026 ends at 195743)'
        default: '195743'
      conc:
        description: 'concurrent lot fetches (keep small — small-business server)'
        default: '4'
      delay:
        description: 'ms between requests, per worker'
        default: '150'
concurrency:
  group: segments-rea
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      START: ${{ inputs.start || '185118' }}
      END: ${{ inputs.end || '195743' }}
      CONC: ${{ inputs.conc || '4' }}
      DELAY: ${{ inputs.delay || '150' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate inputs
        run: |
          for v in START END CONC DELAY; do [[ "${!v}" =~ ^[0-9]+$ ]] || { echo "::error::$v must be a non-negative integer"; exit 1; }; done
      # STRICT pull (no `|| echo` fallback): the rea segment holds ~200K lots
      # on R2. A failed pull followed by a merge-and-push would publish a
      # window-only segment over it — fail the job instead.
      - name: Pull last-good segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment rea
      - name: Back-crawl the itemid window
        timeout-minutes: 300
        run: RAY_SKIP_MAIN=1 npx tsx scripts/backfill-rea.ts --start "$START" --end "$END" --conc "$CONC" --delay "$DELAY" --write
      - name: Push segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-segment rea
