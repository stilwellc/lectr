# Data heal for the CreateAuction trio — re-crawls settled auctions off
# /Lots/Gallery with the boundary-scoped card extractor (title from the lot's
# own anchor, price from its own card) and purges withdrawn ghost rows. Why:
# the original extractor's unbounded parent walk let priceless (withdrawn)
# cards steal a NEIGHBOR's "SOLD FOR" — measured Aug 2026: 27 Lelands rows at
# an identical $3,107,372, 21 LOTG at $436,970, 10 Memory Lane at $612,000 —
# and Memory Lane 2026-06-06 still carries ≥15× identical-price clusters
# ($11,296 ×20, $10,359 ×20, $15,561 ×16, $15,034 ×15 …). Re-running the
# gallery overwrites every priced card by id (keeping a row's exact sale date)
# and deletes the withdrawn ghosts. Idempotent; incremental per-auction writes.
#
# CI caveat (the single Aug 13 2026 run, 31662850740): the auction-switcher
# postback was re-challenged by Cloudflare from GitHub datacenter IPs (106
# auctions → 0 sold) and the job ran 103 min before cancel. So now: Chrome
# install hard-capped at 8 min, the job at 90, and `house` + `sale_date` /
# `auction` inputs target ONE house's auctions around ONE sale (e.g. Memory
# Lane 2026-06-06) instead of the whole archive. If CF still walls the
# postback from CI, the residential-IP path is scripts/oneoff/qa/heal-local.sh
# (same script, needs a valid local Cloudflare token — see
# scripts/oneoff/qa/MEMORYLANE_HEAL_STATUS.md).
name: Gallery heal (CreateAuction trio)
on:
  workflow_dispatch:
    inputs:
      house:
        description: 'which house (all = the trio)'
        type: choice
        options: [all, lelands, memorylane, lotg]
        default: 'all'
      sale_date:
        description: 'YYYY-MM-DD — only auctions whose season date lands within ±75 days (blank = every settled auction)'
        required: false
        default: ''
      auction:
        description: 'optional case-insensitive substring of the auction dropdown name (narrows further)'
        required: false
        default: ''
      max_auctions:
        description: 'cap on auctions crawled per house'
        default: '200'

permissions:
  contents: read

concurrency:
  group: gallery-heal-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  heal:
    strategy:
      fail-fast: false
      matrix:
        house: [lelands, memorylane, lotg]
    runs-on: ubuntu-latest
    concurrency:
      group: segments-${{ matrix.house }}
      cancel-in-progress: false
    timeout-minutes: 90
    # dispatch inputs reach the shell ONLY through env, validated before use
    env:
      HOUSE: ${{ matrix.house }}
      WANT_HOUSE: ${{ inputs.house || 'all' }}
      SALE_DATE: ${{ inputs.sale_date }}
      AUCTION: ${{ inputs.auction }}
      MAX_AUCTIONS: ${{ inputs.max_auctions || '200' }}
    steps:
      - name: Skip if not requested
        id: gate
        run: |
          if [ "$WANT_HOUSE" = "all" ] || [ "$WANT_HOUSE" = "$HOUSE" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == '1'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == '1'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.run == '1'
        run: npm ci --ignore-scripts
      - name: Validate inputs
        if: steps.gate.outputs.run == '1'
        run: |
          [[ "$MAX_AUCTIONS" =~ ^[0-9]+$ ]] || { echo "::error::max_auctions must be an integer"; exit 1; }
          [ -z "$SALE_DATE" ] || [[ "$SALE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::sale_date must be YYYY-MM-DD"; exit 1; }
      - name: Pull this house's segment (last-good)
        if: steps.gate.outputs.run == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment "$HOUSE"
      # Runners ship system Chrome: try the dep-less install, fall through to
      # the preinstalled stable channel; a hung apt path fails in 8 min instead
      # of eating the job cap (the nightly's lesson, Aug 18–19 2026).
      - name: Install Chrome (headless CF clear)
        if: steps.gate.outputs.run == '1'
        timeout-minutes: 8
        run: npx playwright install chrome || npx playwright install --with-deps chrome || which google-chrome
      - name: Re-crawl targeted settled auctions (fixed extractor)
        if: steps.gate.outputs.run == '1'
        timeout-minutes: 75
        run: |
          args=(--house "$HOUSE" --max-auctions "$MAX_AUCTIONS" --write)
          [ -n "$SALE_DATE" ] && args+=(--sale-date "$SALE_DATE")
          [ -n "$AUCTION" ] && args+=(--auction "$AUCTION")
          printf 'crawl-lelands-gallery.ts'; printf ' %q' "${args[@]}"; echo
          RAY_SKIP_MAIN=1 npx tsx scripts/crawl-lelands-gallery.ts "${args[@]}"
      - name: Push healed segment
        if: steps.gate.outputs.run == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-segment "$HOUSE"
