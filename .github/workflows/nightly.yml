name: Nightly (segmented)

# The bulletproof, scalable nightly. Instead of ONE monolith that loads the
# whole ~455k-lot corpus and does crawl→build→deploy in a single job (which hit
# a new ceiling every time the corpus grew — call-stack, 45min timeout, 2GB
# heap), the work is split into staged, isolated, retryable jobs:
#
#   crawl (matrix, one job PER HOUSE, run in parallel, fail-fast: false)
#     → each pulls ONLY its own R2 segment, crawls ONLY its house, writes its
#       segment back. A house failing can't touch another's data, and a crawl
#       that collapses its own segment refuses to overwrite the last-good one.
#   assemble (needs: crawl)
#     → reunions every segment (fresh OR last-good), runs the engine, and a
#       SANITY GATE refuses to publish a corpus that shrank >10%. The only
#       full-corpus job → carries the big heap.
#   deploy (needs: assemble)  →  pinned served payload → build → ship
#   sync   (needs: assemble, non-blocking)  →  supabase + alerts
#   backtest-leg / backtest  →  the point-in-time record (not on the deploy path)
#   health (needs: crawl, non-blocking)  →  leg-health table, red on ok=false
#   handoff-cleanup (last, always)  →  deletes this run's R2 handoff objects
#
# HANDOFFS NEVER RIDE GITHUB ARTIFACTS (Sep 27 2026). The repo is PUBLIC:
# every Actions artifact is downloadable by any GitHub user, and this
# workflow used to upload the whole corpus (corpus-payload ~215MB, one
# segment-<house> per leg). Now, all inside the PRIVATE lectr-data bucket:
#   crawl → assemble   `data-store.sh handoff-put segment-<house>` writes a
#       WRITE-ONCE run-scoped key ci-handoff/<run_id>/segment-<house>/a<attempt>-<UTC>.bin
#       (a new key per write → immediately consistent, no GET-lag), and
#       `assemble-segments` reads it, falling back to the R2 last-good
#       (latest/segments/…) for `other`, rrauction-archive, a failed leg or
#       skip_crawl.
#   assemble → deploy/sync/backtest   assemble's `push` already writes the
#       payloads under a write-once versions/<UTC>-<sha>/ prefix; it emits that
#       prefix as the job output `version`, and every downstream job runs
#       `data-store.sh pull-version <version>` — the exact bytes assemble
#       published, never the (movable) pointer, zero extra upload.
#   backtest-leg → backtest   leg state via ci-handoff/<run_id>/backtest-leg-<m>/.
#   Cleanup: handoff-cleanup deletes ci-handoff/<run_id>/ when nothing failed
#   (a failed run keeps it so "re-run failed jobs" still finds it) and always
#   prunes ci-handoff/ objects older than 2 days. See docs/data-pipeline.md.
# Only small, non-sensitive artifacts remain: validate-engine.json,
# health-<house> (leg-health.json), social-cards (the public JPEGs).
#
# Net: no single job scales with the TOTAL corpus, a partial failure can never
# regress prod, and any stage is retryable in isolation.

on:
  schedule:
    # 04:17 UTC. Off the top of the hour on purpose: GitHub queues :00
    # schedules behind the global rush — the old '0 6' started 11:20–11:50 UTC
    # every night (Sep 2026), publishing at 8–9:30am ET. The run is ~60–90 min
    # (crawl ~40–80, assemble ~45–90), so a 04:17 start publishes ~1–2am ET in
    # summer (EDT) and ~12–1am in winter (EST). If GitHub's schedule lag keeps
    # eating hours, the fix is an external trigger (a Cloudflare cron calling
    # workflow_dispatch), not an earlier cron.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: 'Skip the crawl stage and rebuild from the last-good segments (recovery / assemble-only)'
        type: boolean
        default: false
      incremental_crawl:
        description: "Christie's + Sotheby's incremental crawl (skip fully-resolved sales, carry them forward). auto = crawler default: incremental Mon–Sat, FULL sweep on Sunday UTC (weekly correctness backstop, mirroring the backtest cadence). incremental / full force either mode."
        type: choice
        options: [auto, incremental, full]
        default: auto
      backtest_mode:
        description: "backtest: auto (Sunday = full per-market legs, else incremental) / full / incremental"
        type: choice
        options: [auto, full, incremental]
        default: auto
      sentinel_warn_only:
        description: 'Downgrade the price-bleed SENTINEL from abort to warnings for THIS run (manual recovery only — inspect the signatures first). The corpus-shrink sanity gate and the engine holdout gate still apply.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

# NO SECRETS AT WORKFLOW SCOPE: CLOUDFLARE_* / SOTHEBYS_COOKIE / SUPABASE_* /
# X_* / IG_* are bound on the individual steps that use them, so an `npm ci`
# or a crawler never sees a credential it does not need.
env:
  NODE_OPTIONS: --max-old-space-size=10240
  # playwright is a devDep for the headless legs; its browser download is
  # never part of `npm ci` (which runs --ignore-scripts anyway) — only the
  # headless legs install Chrome, explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Decides once, for every downstream job: FULL per-market backtest replay
  # (Sunday UTC) or the incremental append, plus the ONE list of crawl houses
  # and backtest markets every job below reads.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.plan.outputs.full }}
      houses: ${{ steps.plan.outputs.houses }}
      markets: ${{ steps.plan.outputs.markets }}
    steps:
      - id: plan
        env:
          BACKTEST_MODE: ${{ github.event.inputs.backtest_mode }}
        run: |
          case "$BACKTEST_MODE" in
            full) full=true ;;
            incremental) full=false ;;
            *) if [ "$(date -u +%u)" = "7" ]; then full=true; else full=false; fi ;;
          esac
          # houses: rrauction + lelands/memorylane/lotg are the HEADLESS legs;
          # rea/hugginsscott/scp/hakes/nflauction/mlbauction the standalone
          # sports/pop crawlers; the rest ride the ray-crawl.ts monolith.
          # markets: the engine roster's market keys + 'other' (backtest-merge.sh
          # re-checks this against backtestMarkets() and fails on a gap).
          {
            echo "full=$full"
            echo 'houses=["goldin","sothebys","christies","bonhams","phillips","wright","rrauction","rea","hugginsscott","scp","hakes","lelands","memorylane","lotg","nflauction","mlbauction"]'
            echo 'markets=["art","design","watches","sports","science","culture","tcg","other"]'
          } >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    if: ${{ github.event.inputs.skip_crawl != 'true' }}   # assemble-only recovery reuses last-good segments
    strategy:
      fail-fast: false          # one house failing must NOT cancel the others
      matrix:
        house: ${{ fromJSON(needs.plan.outputs.houses) }}
    runs-on: ubuntu-latest
    # SEGMENT LOCK (Sep 2 2026): every writer of latest/segments/<house> —
    # this leg, gallery-heal, nflauction-heal, backfill-*, resolve-rrauction —
    # must sit in the SAME per-house group so a pull→mutate→push can never
    # interleave with another writer's and drop its rows (the lost-update
    # race). Queue, never cancel. The exact group names the other workflows
    # must adopt are listed in docs/data-pipeline.md ("Segment locks").
    # Belt-and-braces: data-store.sh push-segment also refuses to overwrite a
    # segment that changed in R2 since it was pulled (etag compare-and-swap).
    concurrency:
      group: segments-${{ matrix.house }}
      cancel-in-progress: false
    # 60→90 (Aug 4) → 120 (Sep 10): Christie's measured 77m, H&S 80m. A leg
    # that times out pushes no segment and rides R2 last-good; the ceiling is free.
    timeout-minutes: 120
    env:
      RAY_HOUSE: ${{ matrix.house }}
      # Read by the christies + sothebys houses. '' (scheduled runs / auto) lets
      # the crawler apply its default: incremental Mon–Sat, full sweep Sunday
      # (UTC). '1' forces incremental, '0' forces the full sweep — the dispatch
      # input maps onto exactly those three states.
      INCREMENTAL_CRAWL: ${{ github.event.inputs.incremental_crawl == 'incremental' && '1' || (github.event.inputs.incremental_crawl == 'full' && '0' || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull this house's segment (last-good)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment "$RAY_HOUSE"
      # Headless legs only: Chrome for the resolver. Aug 18+19 2026 this step
      # HUNG for the full job cap (`playwright install --with-deps` apt stall).
      # Runners ship system Chrome: hard 8-min cap, dep-less install first,
      # then the preinstalled stable channel — a failed install fails the LEG
      # in minutes (rides R2 last-good) instead of burning the crawl window.
      - name: Install Chrome (headless legs)
        if: ${{ contains(fromJSON('["rrauction","lelands","memorylane","lotg","mlbauction"]'), matrix.house) }}
        timeout-minutes: 8
        run: npx playwright install chrome || npx playwright install --with-deps chrome || which google-chrome
      # every fetch-based house crawls via the monolith; RR runs its headless
      # resolver instead (writes the rrauction segment directly)
      - name: Crawl ${{ matrix.house }}
        if: ${{ !contains(fromJSON('["rrauction","rea","hugginsscott","scp","hakes","lelands","memorylane","lotg","nflauction","mlbauction"]'), matrix.house) }}
        env:
          # only the Sotheby's leg ever receives the cookie
          SOTHEBYS_COOKIE: ${{ matrix.house == 'sothebys' && secrets.SOTHEBYS_COOKIE || '' }}
        run: npx tsx scripts/ray-crawl.ts
      - name: Crawl rrauction (headless)
        if: matrix.house == 'rrauction'
        run: npx tsx scripts/resolve-rrauction.ts --write
      # sports/pop expansion — standalone crawlers. --live snapshots the house's
      # CURRENT auction as status:'upcoming' lots (re-snapshotted nightly,
      # replaced-not-unioned so closed lots never linger) and RESOLVES closed
      # upcoming ids into settled sales.
      - name: Crawl REA
        if: matrix.house == 'rea'
        # live grid enumerates the running auction (ids are NOT contiguous)
        run: npx tsx scripts/crawl-rea.ts --live --write
      - name: Crawl Huggins & Scott
        if: matrix.house == 'hugginsscott'
        # archive months (settled) + the bid.hugginsandscott.com live grid
        run: npx tsx scripts/crawl-hugginsscott.ts --months 3 --delay 150 --live --write
      - name: Crawl SCP
        if: matrix.house == 'scp'
        # past sweep is ALSO the sold-resolve for closed live sales (same ids)
        run: npx tsx scripts/crawl-scp.ts --auctions 3 --cap 600 --delay 150 --live --write
      # Hake's rides the SAME Bidsquare crawler as SCP (scripts/lib/bidsquare.ts).
      - name: Crawl Hake's
        if: matrix.house == 'hakes'
        run: npx tsx scripts/crawl-hakes.ts --auctions 3 --cap 600 --delay 150 --live --write
      - name: Crawl NFL Auction
        if: matrix.house == 'nflauction'
        # GAME-USED only (iSynApp JSON api, plain curl); final bid IS all-in
        run: npx tsx scripts/crawl-nflauction.ts --closed-pages 30 --delay 150 --live --write
      - name: Crawl MLB Auctions
        if: matrix.house == 'mlbauction'
        # GAME-USED only (same iSynApp platform, sid 1101001)
        run: npx tsx scripts/crawl-mlbauction.ts --closed-pages 30 --delay 400 --live --write
      # CreateAuction trio — HEADLESS (Playwright clears Cloudflare).
      - name: Crawl Lelands (headless)
        if: matrix.house == 'lelands'
        run: npx tsx scripts/crawl-createauction.ts --house lelands --live --write
      - name: Crawl Memory Lane (headless)
        if: matrix.house == 'memorylane'
        run: npx tsx scripts/crawl-createauction.ts --house memorylane --live --write
      - name: Crawl Love of the Game (headless)
        if: matrix.house == 'lotg'
        run: npx tsx scripts/crawl-createauction.ts --house lotg --live --write
      # Christie's online-only + Sotheby's ResultHidden sales gate results away
      # from the crawl paths; the resolvers pull them from the public sources.
      # Non-fatal (a resolver hiccup must not lose the night's crawl) — but
      # never silent: a failure is a ::warning:: + a job-summary line.
      - name: Resolve gated results
        if: matrix.house == 'christies' || matrix.house == 'sothebys'
        run: |
          if npx tsx "scripts/resolve-${RAY_HOUSE}.ts" --write; then exit 0; fi
          msg="resolve-${RAY_HOUSE}.ts failed — tonight's crawl still ships; gated results stay pending until the next run"
          echo "::warning title=resolver ${RAY_HOUSE} failed::${msg}"
          echo "- ⚠️ ${msg}" >> "$GITHUB_STEP_SUMMARY"
      - name: Push this house's segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-segment "$RAY_HOUSE"
      # Same-run handoff to assemble: a write-once, run-scoped key in the
      # PRIVATE bucket (immediately consistent, unlike the overwritten
      # latest/segments/ key the push above just wrote).
      - name: Hand the segment to assemble (private R2, run-scoped)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh handoff-put "segment-${RAY_HOUSE}" "data/corpus/segments/${RAY_HOUSE}.ndjson.gz"
      # {house, ok, fetched, parsed, settled, reason} from the crawler — tiny,
      # counts only. Uploaded even when the leg fails (that's when it matters).
      - name: Upload leg health
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-${{ matrix.house }}
          path: |
            leg-health.json
            data/qa/leg-health*.json
          retention-days: 14
          if-no-files-found: ignore

  assemble:
    needs: [plan, crawl]
    # build from fresh-or-last-good segments even if some crawls failed (or
    # were skipped) — but not on a cancelled run
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    # 60→120 (Aug 4) → 180 (Sep 9): measured 76–89m on a growing corpus. A kill
    # here costs a whole night and publishes nothing (the R2 push is last).
    timeout-minutes: 180
    env:
      # LLM field extraction is advisory and OFF until the ANTHROPIC_API_KEY
      # secret exists; this is only '1' or empty, never the key itself
      RAY_EXTRACT_APPLY: ${{ secrets.ANTHROPIC_API_KEY != '' && '1' || '' }}
    outputs:
      # the write-once versions/<UTC>-<sha> prefix this run published —
      # deploy / sync / backtest read exactly this (data-store.sh pull-version)
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # cheap (~1s): the gate logic under test (sentinel decision table) must
      # hold before it is trusted to gate tonight's publish. Typecheck runs in
      # deploy.yml, where the served JSON the app imports is present.
      - name: Unit tests
        run: npm test
      - name: Segments — this run's crawl handoff, else R2 last-good
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOUSES: ${{ join(fromJSON(needs.plan.outputs.houses), ' ') }}
        run: |
          read -r -a houses <<< "$HOUSES"
          bash scripts/data-store.sh assemble-segments "${houses[@]}" rrauction-archive other
      - name: Pull previous totals + backtest (gate baseline + carry the record + incremental state)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-meta && bash scripts/data-store.sh pull-backtest
      - name: LLM extraction (advisory)
        if: ${{ env.RAY_EXTRACT_APPLY == '1' }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/lib/extract/run.ts
      - name: Assemble + engine (sanity-gated)
        # sentinel_warn_only is the MANUAL recovery valve for the price-bleed
        # sentinel only. It does NOT relax the corpus-shrink sanity gate or
        # the engine holdout gate.
        run: npx tsx scripts/assemble.ts
        env:
          RAY_SENTINEL_WARN_ONLY: ${{ github.event.inputs.sentinel_warn_only == 'true' && '1' || '' }}
      - name: Rebuild eager upcoming payload
        run: npx tsx scripts/build-upcoming.ts
      # ENGINE GATE (Sep 2 2026): temporal holdout through the production
      # replay path. Runs BEFORE the R2 push so a failed gate keeps last-good live.
      - name: Validate engine (temporal holdout gate)
        run: |
          mkdir -p data/qa
          NODE_OPTIONS=--max-old-space-size=10240 npx tsx scripts/validate-engine.ts --sample 30000 --json data/qa/validate-engine.json
      - name: Upload engine validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-engine
          path: data/qa/validate-engine.json
          retention-days: 14
          if-no-files-found: ignore
      # Emit the value book for Starling (the buy-side sibling) → PRIVATE R2.
      # Best-effort: a failure here must never break lectr's own nightly.
      - name: Emit value book → private R2 (Starling)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/emit-value-book.ts
      - name: Push corpus + served to R2
        id: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push
      # versions/ retention: keep the newest 14 (two-week rollback ladder).
      # Non-fatal — a failed prune only defers cleanup — but never silent.
      - name: Prune old R2 versions (keep 14)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if bash scripts/data-store.sh prune 14; then exit 0; fi
          echo "::warning title=R2 prune failed::versions/ prune failed — retries tomorrow; storage grows ~176MB/night until it succeeds"
          echo "- ⚠️ R2 versions/ prune failed (retries tomorrow)" >> "$GITHUB_STEP_SUMMARY"

  # The point-in-time backtest: weekdays run the incremental append
  # (build-backtest-incremental.ts); Sunday runs the FULL replay as per-market
  # legs (backtest-leg matrix) merged by the backtest job. deploy does not
  # depend on any of this.
  # ── FULL REPLAY LEGS (Sunday, or backtest_mode=full) ──────────────────────
  # One leg per market. A market with NO TARGETS (tcg: Pokémon lots carry no
  # house estimate; `other` when every slug is rostered) is legitimately
  # empty for ANY market — scripts/ci/backtest-leg.sh exits 0 and drops an
  # EMPTY.<market> marker (tolerating both the engine's old "throw on no
  # targets" and its explicit empty record). Any other failure still fails
  # the leg, and a failed leg still blocks the merge (partial records are
  # never published).
  backtest-leg:
    needs: [plan, assemble]
    if: ${{ needs.plan.outputs.full == 'true' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    # largest leg (culture, ~94k targets) ≈ 6 min; 60 = 10× headroom
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull tonight's published version (corpus + served)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: bash scripts/data-store.sh pull-version "$VERSION"
      - name: Replay leg ${{ matrix.market }}
        env:
          MARKET: ${{ matrix.market }}
        run: bash scripts/ci/backtest-leg.sh "$MARKET" data/backtest-legs
      - name: Hand the leg state to the merge (private R2, run-scoped)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARKET: ${{ matrix.market }}
        run: bash scripts/data-store.sh handoff-put "backtest-leg-${MARKET}" data/backtest-legs

  # ── THE RECORD (every night) ──────────────────────────────────────────────
  # Weekdays: incremental append. Sunday: merge the legs into the canonical
  # state + backtest.json — runs once EVERY leg finished (scored, or
  # legitimately empty). BLOCKING: a night that cannot produce a record fails
  # the run. Not on the deploy critical path, so a red backtest never
  # withholds a fresh site.
  backtest:
    needs: [plan, assemble, backtest-leg]
    # legs skipped on weekdays still satisfy `needs` via !cancelled()
    if: ${{ !cancelled() && needs.assemble.result == 'success' && (needs.plan.outputs.full != 'true' || needs.backtest-leg.result == 'success') }}
    runs-on: ubuntu-latest
    # incremental measured ~3 min (prep) + scoring at ~460/s; merge is seconds.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull tonight's published version (corpus + served)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: bash scripts/data-store.sh pull-version "$VERSION"
      - name: Fetch leg states (Sunday)
        if: needs.plan.outputs.full == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARKETS: ${{ join(fromJSON(needs.plan.outputs.markets), ' ') }}
        run: |
          # a missing leg is caught by backtest-merge.sh (no state, no EMPTY marker)
          for m in $MARKETS; do
            bash scripts/data-store.sh handoff-get "backtest-leg-$m" data/backtest-legs || echo "::warning::leg $m: no handoff"
          done
      - name: Build the record (merge legs on Sunday · incremental append weekdays)
        id: build
        env:
          FULL: ${{ needs.plan.outputs.full }}
          MARKETS: ${{ join(fromJSON(needs.plan.outputs.markets), ',') }}
        run: |
          if [ "$FULL" = "true" ]; then
            bash scripts/ci/backtest-merge.sh data/backtest-legs "$MARKETS"
          else
            echo "[backtest] weekday — INCREMENTAL append"
            NODE_OPTIONS=--max-old-space-size=12288 npx tsx scripts/build-backtest-incremental.ts
          fi
      # STALE-RECORD CHECK: a record older than 3 days means the append did not
      # happen, whatever the exit code said. Markets whose leg was
      # legitimately empty are exempt from the byMarket n=0 check.
      - name: Refuse a stale record (generatedAt older than 3 days)
        env:
          EMPTY_MARKETS: ${{ steps.build.outputs.empty }}
        run: |
          # shellcheck disable=SC2016  # JS template literals, not shell
          node -e '
            const bt = JSON.parse(require("fs").readFileSync("public/data/ray/backtest.json", "utf8"));
            const age = (Date.now() - Date.parse(bt.generatedAt)) / 864e5;
            console.log(`[backtest] generatedAt ${bt.generatedAt} (${age.toFixed(1)}d old) · engine ${bt.engineVersion} · rows on version ${bt.rowsOnVersionPct}% · n ${bt.calibration.n}`);
            if (!(age <= 3)) { console.error("::error title=stale backtest::backtest.json generatedAt is older than 3 days"); process.exit(1); }
            const exempt = new Set((process.env.EMPTY_MARKETS || "").split(",").filter(Boolean));
            const dead = Object.entries(bt.byMarket || {}).filter(([k, v]) => !exempt.has(k) && (v.flagged.n + v.unflagged.n) === 0).map(([k]) => k);
            if (dead.length) { console.error(`::error title=empty byMarket::${dead.join(",")} carry n=0`); process.exit(1); }
          '
      - name: Push refreshed backtest.json (+ accumulator state)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-backtest
      # FRESHNESS (Sunday full replay only): after a full rebuild nearly every
      # row should be scored by the CURRENT engine version. <90% means the
      # replay did not really rebuild (the Sep 2026 state: 3%, legacy
      # stateEngineVersion). Runs AFTER the push — the record still publishes
      # — but turns the run red so it is seen. deploy never depends on it.
      - name: Record is on the current engine (rowsOnVersionPct ≥ 90 after a full replay)
        if: needs.plan.outputs.full == 'true'
        run: |
          # shellcheck disable=SC2016  # JS template literals, not shell
          node -e '
            const bt = JSON.parse(require("fs").readFileSync("public/data/ray/backtest.json", "utf8"));
            const pct = Number(bt.rowsOnVersionPct);
            console.log(`[backtest] rowsOnVersionPct ${pct}% · engine ${bt.engineVersion} · state engine ${bt.stateEngineVersion ?? "?"}`);
            if (!(pct >= 90)) { console.error(`::error title=backtest not on current engine::rowsOnVersionPct ${pct}% < 90% after a FULL replay`); process.exit(1); }
          '

  deploy:
    needs: assemble
    # run whenever assemble succeeded — even in skip_crawl mode
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    # ONE production-deploy lane shared with deploy.yml (incl. its
    # close-board workflow_call) and ray-crawl.yml: never two wranglers racing
    # Pages production. Queue, don't cancel.
    concurrency:
      group: deploy-collectr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ref: main resolves when the STEP runs (after the concurrency queue),
      # not at run creation — never deploys a checkout a later push superseded.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - run: echo "deploying $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull tonight's published served payload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: bash scripts/data-store.sh pull-version "$VERSION" served-only
      # the intraday overlay is no longer in git — carry prod's (newer) copy
      - name: Seed the freshest close-board overlay
        run: node scripts/ci/seed-close-board.mjs
      # Tonight's social cards ride inside the export so Instagram can fetch
      # them from lectr.bid/social/. A render failure must never hold the data
      # deploy: continue-on-error, and the `social` job finds no today.json.
      - name: Render tonight's social cards
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/social/render.tsx
      - name: Hand the cards to the social job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: social-cards
          path: public/social/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify build self-consistency
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          missing=0
          for f in out/*.html; do
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              [ -f "out$c" ] || { echo "::error::$f references missing chunk $c"; missing=$((missing+1)); }
            done < <(grep -oE '/_next/static/chunks/[a-z0-9/_.-]+\.js' "$f" | sort -u)
          done
          [ "$missing" -eq 0 ] || { echo "::error::$missing missing chunk ref(s)"; exit 1; }
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # RED, never a green "skipped": assemble already pushed tonight's
          # data to R2, so a silent skip here leaves prod stale with no signal
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set — fresh data in R2 but NOT deployed"; exit 1; fi
          npx wrangler@4.120.1 pages deploy out --project-name collectr --branch main --commit-dirty=true

  sync:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}   # non-blocking: never gates a deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # BOTH payloads: sync-lots-db and match-alerts call readCorpus(), which
      # refuses the stripped served files.
      - name: Pull tonight's published version (corpus + served)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: bash scripts/data-store.sh pull-version "$VERSION"
      # Each script retries Supabase calls with bounded backoff internally
      # (4 tries, 2s→4s→8s); a failure that survives that is real and goes
      # RED here. NO EMAIL FEATURES (standing law).
      - name: Sync lots table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync-lots-db.ts
      - name: Match saved-search alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/match-alerts.ts
      - name: Match signal alerts (watchlist flips + your-markets flags)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/match-signal-alerts.ts

  # ── the social desk ───────────────────────────────────────────────────────
  # Posts tonight's card to X and Instagram AFTER the deploy is live.
  # Idempotent via the R2 ledger; no secrets → dry run (a ::warning:: says so).
  social:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: social
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch tonight's cards (rendered by deploy)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: social-cards
          path: public/social
      - name: Post
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          bash scripts/ci/social-desk-check.sh
          npx tsx scripts/social/post.ts

  # ── crawl leg health (NON-BLOCKING) ───────────────────────────────────────
  # Aggregates every leg's leg-health.json into the run summary and goes RED
  # when any leg reported ok=false (e.g. "200 grid, 0 parsed" — the silent
  # REA/H&S zero-ingest of Sep 2026). Nothing depends on this job.
  health:
    needs: [plan, crawl]
    if: ${{ !cancelled() && needs.crawl.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Download leg health
        uses: actions/download-artifact@v8
        continue-on-error: true   # no leg wrote one → the summary says so
        with:
          pattern: health-*
          path: health
      - name: Summarize (red on any ok=false)
        env:
          HOUSES: ${{ join(fromJSON(needs.plan.outputs.houses), ',') }}
        run: node scripts/ci/leg-health-summary.mjs health "$HOUSES"

  # ── HANDOFF CLEANUP (always, last) ────────────────────────────────────────
  # Deletes this run's ci-handoff/<run_id>/ prefix once every consumer is
  # done — unless something failed, in which case it is KEPT so "re-run failed
  # jobs" still finds it. Either way, prunes ci-handoff/ objects older than
  # 2 days (cancelled/failed runs). Backstop: R2 lifecycle rule on ci-handoff/
  # (docs/data-pipeline.md).
  handoff-cleanup:
    needs: [crawl, assemble, backtest-leg, backtest, deploy, sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Delete this run's handoff (when nothing failed)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh handoff-clean
      - name: Prune handoffs older than 2 days (any run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh handoff-prune 2
