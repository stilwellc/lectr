name: Nightly (segmented)

# The bulletproof, scalable nightly. Instead of ONE monolith that loads the
# whole ~455k-lot corpus and does crawl→build→deploy in a single job (which hit
# a new ceiling every time the corpus grew — call-stack, 45min timeout, 2GB
# heap), the work is split into staged, isolated, retryable jobs:
#
#   crawl (matrix, one job PER HOUSE, run in parallel, fail-fast: false)
#     → each pulls ONLY its own R2 segment, crawls ONLY its house, writes its
#       segment back. A house failing can't touch another's data, and a crawl
#       that collapses its own segment refuses to overwrite the last-good one.
#   assemble (needs: crawl, if: always)
#     → reunions every segment (fresh OR last-good), runs the engine, and a
#       SANITY GATE refuses to publish a corpus that shrank >10%. The only
#       full-corpus job → carries the big heap.
#   deploy (needs: assemble)  →  pull served → build → ship
#   sync   (needs: assemble, if: always, non-blocking)  →  supabase + alerts
#
# Segment handoff: crawl→assemble rides SAME-RUN GitHub artifacts (immediately
# consistent — no R2 GET-lag wait, which cost ~12min/night). R2 keeps every
# segment too: it's tomorrow's last-good baseline and the recovery source —
# any house missing an artifact (crawl failed, skip_crawl, or `other`, which
# no crawl job produces) falls back to its R2 last-good.
#
# Payload handoff: the SAME pattern now runs assemble→{deploy,sync,backtest}.
# assemble uploads served-payload + corpus-payload as same-run artifacts; the
# three downstream jobs try the artifact first and only fall back to
# `data-store.sh pull` (R2) when it's absent — a job rerun after artifact
# expiry, or a manual re-dispatch. That fallback is cheap now too: data-store
# publishes to write-once versions/ keys behind a tiny pointer, so only the
# pointer read can lag, never the 18MB payload GETs.
#
# Net: no single job scales with the TOTAL corpus, a partial failure can never
# regress prod, and any stage is retryable in isolation.

on:
  schedule:
    # 06:00 UTC = 1am EST (2am EDT) — the overnight window: houses have closed
    # their timed sessions, and the fresh corpus is live before the US morning.
    # (GitHub cron is UTC-fixed; 06:00 keeps it in the 1–2am Eastern band
    # year-round.)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: 'Skip the crawl stage and rebuild from the last-good segments (recovery / assemble-only)'
        type: boolean
        default: false
      incremental_crawl:
        description: "Christie's + Sotheby's incremental crawl (skip fully-resolved sales, carry them forward). auto = crawler default: incremental Mon–Sat, FULL sweep on Sunday UTC (weekly correctness backstop, mirroring the backtest cadence). incremental / full force either mode."
        type: choice
        options: [auto, incremental, full]
        default: auto

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=10240
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # playwright is a devDep for the one headless leg (rrauction). Skip its
  # postinstall browser download in EVERY job's `npm ci` — only the rrauction
  # leg installs a browser, explicitly, via `npx playwright install chrome`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  crawl:
    if: ${{ github.event.inputs.skip_crawl != 'true' }}   # assemble-only recovery reuses last-good segments
    strategy:
      fail-fast: false          # one house failing must NOT cancel the others
      matrix:
        # rrauction is the one HEADLESS leg (Cloudflare-gated — no fetch/API
        # path): it installs Chrome + runs the Playwright resolver, isolated so
        # its browser dependency and any CF flakiness can never touch the other
        # houses' segments.
        # rea/hugginsscott/scp = the sports+pop-culture expansion (Aug 2026).
        # Each runs its own standalone crawler (curl, no headless), writes+merges
        # its own segment, and rides the same pull/push/artifact plumbing. They
        # crawl a bounded recent window and MERGE into their segment, so a run
        # never wipes accumulated history. Additive: they can only add lots to
        # the sports/pop verticals, never regress the existing corpus.
        # lelands/memorylane/lotg = the CreateAuction trio — HEADLESS legs (same
        # Cloudflare-clearing Playwright pattern as rrauction; one crawler, three
        # houses). rea/hugginsscott/scp = curl legs. All additive to sports/pop.
        house: [goldin, sothebys, christies, bonhams, phillips, wright, rrauction, rea, hugginsscott, scp, lelands, memorylane, lotg, nflauction, mlbauction]
    runs-on: ubuntu-latest
    # RAISED 60→90 (Aug 4 2026): christies measured 43.9min (Aug 3) / 34.6min
    # (Aug 4) — it peaked at 73% of the old ceiling. A house that times out
    # pushes no segment, and the seedless/last-good guards then have to catch
    # it; cheaper to give the slow houses room. Ceiling costs nothing.
    timeout-minutes: 90
    env:
      SOTHEBYS_COOKIE: ${{ secrets.SOTHEBYS_COOKIE }}
      RAY_HOUSE: ${{ matrix.house }}
      # Read by the christies + sothebys houses. '' (scheduled runs / auto) lets
      # the crawler apply its default: incremental Mon–Sat, full sweep Sunday
      # (UTC). '1' forces incremental, '0' forces the full sweep — the dispatch
      # input maps onto exactly those three states.
      INCREMENTAL_CRAWL: ${{ github.event.inputs.incremental_crawl == 'incremental' && '1' || (github.event.inputs.incremental_crawl == 'full' && '0' || '') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Pull this house's segment (last-good)
        run: bash scripts/data-store.sh pull-segment ${{ matrix.house }}
      # Headless legs only: Chrome for the resolver. Scoped so no other house
      # pays the install cost. Aug 18+19 2026 this step HUNG for the full 90-min
      # job cap on lelands/lotg/rrauction (orphan `playwright install
      # --with-deps` killed at timeout — apt dependency path stalls). Runners
      # already ship system Chrome, so: hard 8-min step cap, try the dep-less
      # install first, and fall through to the preinstalled stable channel —
      # a failed install now fails the LEG in minutes (rides R2 last-good)
      # instead of silently burning the whole crawl window.
      - name: Install Chrome (headless legs)
        if: ${{ contains(fromJSON('["rrauction","lelands","memorylane","lotg"]'), matrix.house) }}
        timeout-minutes: 8
        run: npx playwright install chrome || npx playwright install --with-deps chrome || which google-chrome
      # every fetch-based house crawls via the monolith; RR runs its headless
      # resolver instead (writes the rrauction segment directly)
      - name: Crawl ${{ matrix.house }}
        if: ${{ !contains(fromJSON('["rrauction","rea","hugginsscott","scp","lelands","memorylane","lotg","nflauction","mlbauction"]'), matrix.house) }}
        run: npx tsx scripts/ray-crawl.ts
      - name: Crawl rrauction (headless)
        if: matrix.house == 'rrauction'
        run: npx tsx scripts/resolve-rrauction.ts --write
      # sports/pop expansion — standalone crawlers. --live snapshots the house's
      # CURRENT auction as status:'upcoming' lots (same lifecycle as Goldin/RR:
      # re-snapshotted + updated every night, replaced-not-unioned so closed
      # lots never linger) and RESOLVES closed upcoming ids into settled sales —
      # which is also how new sold history now arrives, replacing the old
      # hand-tuned id windows (they sat fully-harvested at +0 new for weeks).
      - name: Crawl REA
        if: matrix.house == 'rea'
        # live grid enumerates the running auction (ids are NOT contiguous —
        # 2026 Summer spans 185118..195743, so no id window can cover it)
        run: npx tsx scripts/crawl-rea.ts --live --write
      - name: Crawl Huggins & Scott
        if: matrix.house == 'hugginsscott'
        # archive months (settled) + the new bid.hugginsandscott.com live grid
        run: npx tsx scripts/crawl-hugginsscott.ts --months 3 --delay 150 --live --write
      - name: Crawl SCP
        if: matrix.house == 'scp'
        # past sweep is ALSO the sold-resolve for closed live sales (same ids)
        run: npx tsx scripts/crawl-scp.ts --auctions 3 --cap 600 --delay 150 --live --write
      - name: Crawl NFL Auction
        if: matrix.house == 'nflauction'
        # GAME-USED only (league charity house; iSynApp JSON api, plain curl).
        # closed sweep is the sold-resolve — final bid IS all-in (no premium)
        run: npx tsx scripts/crawl-nflauction.ts --closed-pages 30 --delay 150 --live --write
      - name: Crawl MLB Auctions
        if: matrix.house == 'mlbauction'
        # GAME-USED only (same iSynApp platform, sid 1101001; winning-bid page
        # render is the sold gate — the MLB config exposes no reserveAmt)
        run: npx tsx scripts/crawl-mlbauction.ts --closed-pages 30 --delay 400 --live --write
      # CreateAuction trio — HEADLESS (Playwright clears Cloudflare, same as
      # rrauction). --live reads the current sale off /Lots/Gallery (one nav,
      # bids inline) + per-lot resolve of closed upcoming ids.
      - name: Crawl Lelands (headless)
        if: matrix.house == 'lelands'
        run: npx tsx scripts/crawl-createauction.ts --house lelands --live --write
      - name: Crawl Memory Lane (headless)
        if: matrix.house == 'memorylane'
        run: npx tsx scripts/crawl-createauction.ts --house memorylane --live --write
      - name: Crawl Love of the Game (headless)
        if: matrix.house == 'lotg'
        run: npx tsx scripts/crawl-createauction.ts --house lotg --live --write
      # Christie's online-only + Sotheby's ResultHidden sales gate results away
      # from the crawl paths; the resolvers pull them from the public sources
      # (onlineonly pages / the Algolia search index) so closed lots can't rot
      # pending or mis-settle to bought_in. Non-fatal: a resolver hiccup must
      # not lose the night's crawl.
      - name: Resolve gated results
        if: matrix.house == 'christies' || matrix.house == 'sothebys'
        run: npx tsx scripts/resolve-${{ matrix.house }}.ts --write || echo "resolver failed (non-fatal)"
      - name: Push this house's segment
        run: bash scripts/data-store.sh push-segment ${{ matrix.house }}
      # Same-run handoff to assemble (immediately consistent, no R2 GET-lag).
      # The R2 push above stays: tomorrow's last-good baseline + recovery source.
      - name: Upload segment artifact
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.house }}
          path: data/corpus/segments/${{ matrix.house }}.ndjson.gz
          retention-days: 2
          if-no-files-found: error

  assemble:
    needs: crawl
    if: always()                # build from fresh-or-last-good segments even if some crawls failed
    runs-on: ubuntu-latest
    # Normal night: artifacts skip the pull-segments GET-lag (~12min) entirely.
    # But skip_crawl / a failed house still pulls from R2 and can eat the lag,
    # so keep headroom (engine ~21 + upcoming on top).
    # RAISED 60→120 (Aug 4 2026): measured assemble wall-clock is 37.5min
    # (Aug 3) → 42min (Aug 4) — 70% of the old ceiling and climbing with the
    # corpus. build-market's MARKETS is now derived from ARTISTS (science-tech
    # restored), which adds markets to every per-market pass, so this job's
    # cost only goes up. A timeout here kills the night mid-assemble; the
    # ceiling is free (Actions bills minutes USED, not reserved).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # Fresh segments from THIS run's crawl jobs — immediately consistent, no
      # GET-lag. Absent for failed houses and in skip_crawl mode; continue-on-error
      # lets the R2 fallback below fill every gap.
      - name: Download fresh segments (same-run artifacts)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: segment-*
          merge-multiple: true
          path: data/corpus/segments/
      # R2 fallback: only segments NOT delivered as artifacts (crawl-failed
      # house, skip_crawl, and always `other` — no crawl job produces it).
      # Pulls run in parallel like pull-segments: worst case ONE lag window.
      - name: Pull missing segments from R2 (last-good fallback)
        run: |
          mkdir -p data/corpus/segments
          pids="" rc=0
          for h in goldin sothebys christies bonhams phillips wright rrauction rrauction-archive other rea hugginsscott scp lelands memorylane lotg nflauction mlbauction; do
            if [ -f "data/corpus/segments/$h.ndjson.gz" ]; then
              echo "segment $h fresh from artifact — skipping R2"
            else
              bash scripts/data-store.sh pull-segment "$h" & pids="$pids $!"
            fi
          done
          for p in $pids; do wait "$p" || rc=1; done
          exit $rc
      - name: Pull previous totals + backtest (gate baseline + carry the record + incremental state)
        run: bash scripts/data-store.sh pull-meta && bash scripts/data-store.sh pull-backtest
      - name: Assemble + engine (sanity-gated)
        run: npx tsx scripts/assemble.ts
      - name: Rebuild eager upcoming payload
        run: npx tsx scripts/build-upcoming.ts
      # Emit the value book for Starling (the buy-side sibling) → PRIVATE R2.
      # Best-effort: a failure here must never break lectr's own nightly.
      - name: Emit value book → private R2 (Starling)
        run: npx tsx scripts/emit-value-book.ts
        continue-on-error: true
      - name: Push corpus + served to R2
        run: bash scripts/data-store.sh push
      # versions/ retention: each push adds ~176MB of write-once payloads; keep
      # the newest 14 (a two-week manual-rollback ladder) and delete the rest.
      # Non-fatal — a failed prune only defers cleanup to the next night.
      - name: Prune old R2 versions (keep 14)
        run: bash scripts/data-store.sh prune 14 || echo "prune failed (non-fatal, retries tomorrow)"
      # Same-run handoff to deploy/sync/backtest — immediately consistent, no
      # R2 round-trip at all. The R2 push above stays authoritative: it's what
      # reruns, manual dispatches and push-triggered deploy.yml read.
      - name: Upload served payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: served-payload
          path: public/data/ray/
          retention-days: 1
          if-no-files-found: error
      # NOTE: the glob also carries data/corpus/backtest-state.json.gz (fetched
      # by pull-backtest above) — the raw accumulator state the backtest job's
      # NIGHTLY INCREMENTAL rehydrates to append newly-closed lots. Deliberate:
      # the state must travel with the corpus it will be appended against.
      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-payload
          path: data/corpus/*.json.gz
          retention-days: 1
          if-no-files-found: error

  # The point-in-time backtest. The record is CUMULATIVE history that barely
  # moves night to night, so the nightly path (Mon–Sat) runs the FAST INCREMENTAL
  # (build-backtest-incremental.ts): it scores ONLY the lots that closed since the
  # last run and APPENDS them, finishing in a small fraction of the full replay.
  # SUNDAY runs the FULL replay (build-backtest.ts) as the correctness backstop —
  # it re-scores every concluded lot from scratch, which is the only thing that
  # corrects retroactive-prior drift (a backfilled lot dated before an
  # already-scored target; see build-backtest-incremental.ts for the exact
  # bound) and refreshes the recency-weighting anchor. Both paths call identical
  # scoring code (backtest-core.ts), so incremental rows are byte-identical to a
  # full replay's, and both carry forward the sidecar state (backtest-state.json)
  # the incremental rehydrates. Runs OFF the critical path in parallel with deploy.
  backtest:
    needs: assemble
    if: always()
    runs-on: ubuntu-latest
    # NON-BLOCKING by design: the backtest is a standalone replay that refreshes
    # backtest.json for the NEXT cycle — it is NOT on the deploy critical path
    # (deploy needs assemble, not this), and the record barely moves night to
    # night. continue-on-error means a slow-or-failed backtest can NEVER cancel
    # the run or mask the fact that the crawl+assemble+deploy already shipped.
    # (Root cause of the 2026-07-24/25 "cancelled" nights: this replay outgrew
    # its 70min cap as the corpus passed ~500k lots — the job self-cancelled on
    # timeout and dragged the whole run's conclusion to "cancelled" even though
    # the site had already deployed fresh data successfully. The nightly
    # incremental now finishes in minutes; only the weekly full needs headroom.)
    continue-on-error: true
    # Headroom sized for the WEEKLY full replay (the O(targets×priors) pass runs
    # well past 70min at current corpus size). Aug 16 2026 the full replay was
    # KILLED at the old 300-min cap (corpus growth outran it) — 350 rides just
    # under GH's hard 360-min job ceiling. If a Sunday hits THIS cap, the replay
    # must be split (per-market legs), not re-capped. continue-on-error is the
    # belt-and-braces so even an overrun can't gate the run.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # Same-run artifacts from assemble — immediately consistent, no R2 read.
      # continue-on-error: absent on a rerun after expiry / manual dispatch,
      # where the R2 fallback below takes over.
      - name: Fetch served payload (same-run artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: served-payload
          path: public/data/ray
      - name: Fetch corpus (same-run artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: corpus-payload
          path: data/corpus
      - name: Pull corpus + served from R2 (fallback if artifacts absent)
        run: |
          if [ -f public/data/ray/meta.json ] && [ -f data/corpus/lots.json.gz ]; then
            echo "payloads delivered by same-run artifacts — skipping R2 pull"
          else
            bash scripts/data-store.sh pull
          fi
      # Sunday (day-of-week 7) → FULL rebuild backstop; Mon–Sat → fast incremental
      # append. A day-of-week guard in the ONE step (not a separate scheduled
      # job) keeps the artifact-first + R2-fallback plumbing above shared by both
      # paths and lets BOTH ride the same-run corpus-payload artifact — a separate
      # Sunday cron would be its own run with no assemble artifacts, forcing the
      # slow R2 fallback every week. The incremental self-falls-back to a full
      # build when no prior state exists (first run, or after a state-file gap).
      - name: Rebuild point-in-time backtest (full on Sun, incremental Mon–Sat)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "[backtest] Sunday — running FULL rebuild (correctness backstop)"
            npx tsx scripts/build-backtest.ts
          else
            echo "[backtest] weekday — running INCREMENTAL append"
            npx tsx scripts/build-backtest-incremental.ts
          fi
      - name: Push refreshed backtest.json (+ accumulator state)
        run: bash scripts/data-store.sh push-backtest

  deploy:
    needs: assemble
    # run whenever assemble succeeded — even in skip_crawl mode, where the
    # skipped crawl would otherwise skip this whole downstream job.
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    # ONE production-deploy lane shared with deploy.yml (and ray-crawl.yml):
    # never two wranglers racing Pages production — whichever finished last
    # used to win, so this leg could silently revert a same-night hotfix.
    # Queue, don't cancel: a nightly data deploy must not kill an in-flight
    # code deploy or vice versa. (Job-level group composes with the run-level
    # `nightly` group.)
    concurrency:
      group: deploy-collectr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 20 is plenty now: the served payload arrives as a same-run artifact, and
    # even the R2 fallback no longer waits out GET-lag on the big payloads
    # (write-once versions/ keys — only the tiny pointer can lag).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Serialization (the concurrency group above) fixes interleaving but not
      # staleness: a queued deploy still holds the commit checked out at RUN
      # start, which could post-date-revert a push that deployed while this
      # leg sat in the queue. Always deploy origin/main as of NOW.
      - name: Fast-forward to origin/main (never deploy a stale checkout)
        run: |
          git fetch --depth=1 origin main
          git checkout --force origin/main
          echo "deploying $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # Same-run artifact from assemble — immediately consistent, no R2 read.
      - name: Fetch served payload (same-run artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: served-payload
          path: public/data/ray
      - name: Pull served payload from R2 (fallback if artifact absent)
        run: |
          if [ -f public/data/ray/meta.json ]; then
            echo "served payload delivered by same-run artifact — skipping R2 pull"
          else
            bash scripts/data-store.sh pull
          fi
      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify build self-consistency
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          missing=0
          for f in out/*.html; do
            for c in $(grep -oE '/_next/static/chunks/[a-z0-9/_.-]+\.js' "$f" | sort -u); do
              [ -f "out$c" ] || { echo "::error::$f references missing chunk $c"; missing=$((missing+1)); }
            done
          done
          [ "$missing" -eq 0 ] || { echo "::error::$missing missing chunk ref(s)"; exit 1; }
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no CF token — skipping deploy"; exit 0; fi
          npx wrangler@4.120.1 pages deploy out --project-name collectr --branch main --commit-dirty=true

  sync:
    needs: assemble
    if: always()                # non-blocking: alerts/supabase must never gate a deploy
    runs-on: ubuntu-latest
    # Was 45 to survive the re-pull GET-lag (a 20 cap once timed out INSIDE the
    # pull). The artifact handoff + write-once R2 keys removed that wait; 30
    # still leaves generous room for sync + alerts on a slow night.
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # Same-run artifacts from assemble — immediately consistent, no R2 read.
      # BOTH payloads: sync-lots-db and match-alerts call readCorpus(), which
      # refuses the stripped served files — without the corpus artifact this
      # job was a silent no-op every normal night (masked green by the
      # non-fatal echoes below).
      - name: Fetch served payload (same-run artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: served-payload
          path: public/data/ray
      - name: Fetch corpus (same-run artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: corpus-payload
          path: data/corpus
      - name: Pull corpus + served from R2 (fallback if artifacts absent)
        run: |
          if [ -f public/data/ray/meta.json ] && [ -f data/corpus/lots.json.gz ]; then
            echo "payloads delivered by same-run artifacts — skipping R2 pull"
          else
            bash scripts/data-store.sh pull
          fi
      - name: Sync lots table
        run: npx tsx scripts/sync-lots-db.ts || echo "sync-lots failed (non-fatal)"
      - name: Match saved-search alerts
        run: npx tsx scripts/match-alerts.ts || echo "match-alerts failed (non-fatal)"
      - name: Match signal alerts (watchlist flips + your-markets flags)
        run: npx tsx scripts/match-signal-alerts.ts || echo "signal-alerts failed (non-fatal)"
      - name: Send alert digests
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: npx tsx scripts/send-digest.ts || echo "send-digest failed (non-fatal)"
