# One-off (re-runnable) NFL Auction back-crawl: sweeps the ENTIRE closed
# archive the platform still serves (~a year of retention), decides game-used
# on full lot-page titles, and unions into the nflauction segment on R2 —
# tonight's assemble picks it up via the segment fallback. Dispatch-only.
name: Backfill NFL Auction (closed archive)
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'max closed pages per sweep (100 rows each)'
        default: '200'
concurrency:
  group: segments-nflauction
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAGES: ${{ inputs.pages || '200' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate inputs
        run: '[[ "$PAGES" =~ ^[0-9]+$ ]] || { echo "::error::pages must be a non-negative integer"; exit 1; }'
      # STRICT pull (no `|| echo` fallback): a failed pull followed by a
      # merge-and-push would publish a sweep-only segment over the real one.
      # A genuinely-absent segment still passes (pull-segment returns 0 when
      # the bucket listing confirms "not in R2 yet").
      - name: Pull last-good segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment nflauction
      # (the idwalk mode was RETIRED Aug 30 2026 — its price scrape read the
      # Hot-Items sidebar widget, not the lot; crawl-nflauction.ts exits 1 on
      # --idwalk. See scripts/heal-nflauction-idwalk.ts.)
      - name: Back-crawl closed archive
        run: RAY_SKIP_MAIN=1 npx tsx scripts/crawl-nflauction.ts --backfill --closed-pages "$PAGES" --delay 150 --write
      - name: Push segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-segment nflauction
