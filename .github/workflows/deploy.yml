name: Deploy to Cloudflare Pages

# The site is a pure static export (output: 'export') hosted on Cloudflare
# Pages as project "collectr" — no git integration, this workflow IS the
# deploy pipeline. Fires on every push to main (code changes; data lives in
# R2 and is pulled at build time), on manual dispatch, and as a REUSABLE
# workflow: close-board.yml calls it (workflow_call) with its freshly built
# intraday overlay — a GITHUB_TOKEN push can never trigger `on: push`, which
# is why the overlay used to wait for the next nightly (Sep 2026).

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      close_board_artifact:
        description: 'name of a same-run artifact holding a fresh close-board.json to bake in'
        type: string
        required: false
        default: ''
    # callers pass `secrets: inherit`. Each token falls back to the legacy
    # all-powerful CLOUDFLARE_API_TOKEN until the split tokens exist
    # (docs/RUNBOOK.md "Tokens"); CF_PAGES_TOKEN may live only in the
    # 'production' environment, which the deploy job below names.
    secrets:
      CF_R2_READ_TOKEN:
        required: false
      CF_PAGES_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ONE production-deploy lane shared with nightly.yml's deploy job,
    # close-board.yml (via this workflow) and ray-crawl.yml. Job-level so it
    # also serializes when called as a reusable workflow. Queue, never cancel:
    # a cancel could kill a nightly data deploy mid-upload.
    concurrency:
      group: deploy-collectr
      cancel-in-progress: false
    # deploy secrets live in the 'production' environment (docs/RUNBOOK.md)
    environment: production
    # generous: the R2 GET-lag guard in data-store.sh can wait ~14min for the
    # pointer to become GET-visible before baking
    timeout-minutes: 40
    steps:
      # ref: main resolves when the STEP runs (after the deploy-collectr queue),
      # not at run creation — a queued run can never deploy a checkout that a
      # later push already superseded (this replaced the manual fast-forward).
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - run: echo "deploying $(git rev-parse --short HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Data lives in R2 (bucket lectr-data), not git — pull the served
      # payloads so the export bakes fresh data (freshness-guarded).
      - name: Pull data from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull

      # The intraday overlay (not in git since Sep 27 2026): the caller's fresh
      # copy when close-board.yml invoked us, and production's live copy
      # always — newest generatedAt wins over the nightly's served copy.
      - name: Fetch the caller's close-board overlay
        if: ${{ inputs.close_board_artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.close_board_artifact }}
          path: ${{ runner.temp }}/close-board
      - name: Seed the freshest close-board overlay
        env:
          CANDIDATE: ${{ inputs.close_board_artifact != '' && format('{0}/close-board/close-board.json', runner.temp) || '' }}
        run: |
          if [ -n "$CANDIDATE" ]; then node scripts/ci/seed-close-board.mjs "$CANDIDATE"; else node scripts/ci/seed-close-board.mjs; fi

      # GUARD 0 — never deploy OLDER data than production already serves.
      # Compare lastCrawl (ISO — lexicographic order IS chronological) against
      # the live site's meta.json. Prod unreachable → proceed (a code fix must
      # still ship); DEPLOY_ALLOW_OLDER=1 repo variable for a deliberate rollback.
      - name: Refuse to deploy data older than production
        env:
          DEPLOY_ALLOW_OLDER: ${{ vars.DEPLOY_ALLOW_OLDER }}
        run: |
          local_stamp=$(python3 -c "import json;print(json.load(open('public/data/ray/meta.json')).get('lastCrawl',''))" 2>/dev/null || echo "")
          [ -n "$local_stamp" ] || { echo "::error::public/data/ray/meta.json missing or has no lastCrawl after the R2 pull — refusing to bake a data-less export"; exit 1; }
          prod_stamp=$(curl -sf --max-time 20 "https://lectr.bid/data/ray/meta.json?cb=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('lastCrawl',''))" 2>/dev/null || echo "")
          if [ -z "$prod_stamp" ]; then echo "prod meta.json unreadable — cannot compare; deploying local ($local_stamp)"; exit 0; fi
          if [[ "$local_stamp" < "$prod_stamp" ]]; then
            if [ "${DEPLOY_ALLOW_OLDER:-0}" = "1" ]; then echo "::warning::deploying OLDER data ($local_stamp) over prod ($prod_stamp) — DEPLOY_ALLOW_OLDER=1"; exit 0; fi
            echo "::error::local data ($local_stamp) is OLDER than production ($prod_stamp) — refusing to regress prod. Re-run after \`data-store.sh pull\` resolves the fresh pointer, or set DEPLOY_ALLOW_OLDER=1 for a deliberate rollback."
            exit 1
          fi
          echo "✓ local data $local_stamp ≥ prod $prod_stamp"

      # CODE GATE — typecheck needs the served JSON the app imports (pulled
      # above), so it runs here, not before the pull. Lint gates on errors
      # only (eslint.config.mjs; legacy-noise rules are warnings).
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint

      # build-og pre-renders the share cards, then next exports the site to out/
      - name: Build static export
        # Supabase keys are public-safe (RLS protects the data), so repo
        # Variables not Secrets. Absent → auth stays dormant.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # GUARD 1 — never DEPLOY a broken build: every JS chunk the exported HTML
      # references must exist in out/.
      - name: Verify build self-consistency
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — build did not export"; exit 1; }
          missing=0
          for f in out/*.html; do
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              [ -f "out$c" ] || { echo "::error::$f references missing chunk $c"; missing=$((missing+1)); }
            done < <(grep -oE '/_next/static/chunks/[a-z0-9/_.-]+\.js' "$f" | sort -u)
          done
          if [ "$missing" -gt 0 ]; then echo "::error::$missing missing chunk reference(s) — refusing to deploy broken code"; exit 1; fi
          echo "✓ build self-consistent — all referenced chunks present in out/"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::no Pages deploy token — create CF_PAGES_TOKEN (Account → Cloudflare Pages → Edit) per docs/RUNBOOK.md \"Tokens\" and add it to the 'production' environment: gh secret set CF_PAGES_TOKEN --env production"
            exit 1
          fi
          out=$(npx wrangler@4.120.1 pages deploy out --project-name collectr --branch main --commit-dirty=true 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9]+\.collectr-2ks\.pages\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # GUARD 2 — never LEAVE a broken deploy live: the exact deployment URL's
      # home JS chunk must serve as executable JavaScript.
      - name: Verify deploy serves executable JS
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          url="$DEPLOY_URL"
          [ -n "$url" ] || { echo "::error::could not capture deploy URL"; exit 1; }
          echo "verifying $url"
          for i in $(seq 1 8); do
            html=$(curl -s "$url/?cb=$i" || true)
            # bundler-agnostic: Turbopack (Next 16 default) names chunks by
            # content hash, not app/page-<hash>.js — take the first real chunk
            chunk=$(echo "$html" | grep -oE 'src="/_next/static/chunks/[A-Za-z0-9_.-]+\.js"' | head -1 | sed -E 's/^src="|"$//g')
            if [ -n "$chunk" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url$chunk")
              ctype=$(curl -s -o /dev/null -w '%{content_type}' "$url$chunk")
              echo "attempt $i: $chunk -> $code $ctype"
              if [ "$code" = "200" ] && echo "$ctype" | grep -qi javascript; then
                echo "✓ deploy verified — home JS resolves and executes"; exit 0
              fi
            else
              echo "attempt $i: no page chunk in HTML yet"
            fi
            sleep 8
          done
          echo "::error::Deploy verification FAILED — the deployed home JS chunk does not resolve as JavaScript. Production build is broken; investigate before trusting this deploy."
          exit 1
