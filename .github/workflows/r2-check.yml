name: R2 access check

# One-shot probe: does the CLOUDFLARE_API_TOKEN secret (created for Pages
# deploys) also carry R2 Object Read & Write? The data pipeline (ray-crawl /
# deploy) pulls and pushes the corpus from the lectr-data bucket, so CI must
# be able to touch R2. Delete this workflow once the answer is known.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe R2 with the CI token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@latest >/dev/null 2>&1 || npm i -g wrangler
          echo "ci-probe $(date -u +%Y%m%dT%H%M%SZ)" > probe-ci.txt
          if npx wrangler r2 object put lectr-data/probe-ci.txt --file probe-ci.txt --remote; then
            echo "R2_WRITE=ok"
          else
            echo "R2_WRITE=denied"; exit 1
          fi
          npx wrangler r2 object get lectr-data/probe-ci.txt --file probe-back.txt --remote && echo "R2_READ=ok"
