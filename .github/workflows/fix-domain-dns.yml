name: Fix lectr.bid DNS routing

# One-off (workflow_dispatch): the Pages custom-domain auto-attach left
# lectr.bid without a record routing to the collectr project (edge answered
# but 522'd — no origin). This points a proxied CNAME at collectr-2ks.pages.dev
# for the apex + www, using the CLOUDFLARE_API_TOKEN secret (Zone:DNS:Edit).
# Safe to re-run: it clears existing apex/www records first.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Point lectr.bid at the collectr Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZID=$(api "https://api.cloudflare.com/client/v4/zones?name=lectr.bid" | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "zone=$ZID"
          for NAME in lectr.bid www.lectr.bid; do
            # delete any existing records at this name (bad auto-created ones)
            for RID in $(api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?name=$NAME" | python3 -c "import json,sys;[print(r['id']) for r in json.load(sys.stdin)['result']]"); do
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$RID" >/dev/null
              echo "  deleted $NAME/$RID"
            done
            # create the proxied CNAME to the Pages project
            RES=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"$NAME\",\"content\":\"collectr-2ks.pages.dev\",\"proxied\":true}")
            echo "  $NAME -> $(echo "$RES" | python3 -c "import json,sys;d=json.load(sys.stdin);print('OK' if d['success'] else d['errors'])")"
          done
          echo "done — lectr.bid now routes to collectr-2ks.pages.dev"
