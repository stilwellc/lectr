name: Ray - Crawl Auction Data

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # the crawl grew a lot (6 houses + Goldin + watches/science/sports auction
    # APIs) — 15 min was cutting it close, so give it real headroom
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npx tsx scripts/ray-crawl.ts

      - name: Rebuild the point-in-time backtest
        run: npx tsx scripts/build-backtest.ts

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ray/
          git diff --staged --quiet && echo "no data changes" && exit 0
          git commit -m "chore(ray): update auction data"
          # the crawl takes ~15 min — if anything landed on main meanwhile,
          # rebase our data commit on top and retry rather than fail
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i rejected, retrying…"; sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
