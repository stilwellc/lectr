name: Ray - Crawl Auction Data

# The data commit this pushes to main triggers deploy.yml, which rebuilds the
# static export and ships it to Cloudflare Pages — that's how fresh data goes
# live (the site has no server; data is baked into the deploy).

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOTHEBYS_COOKIE: ${{ secrets.SOTHEBYS_COOKIE }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # the crawl grew a lot (6 houses + Goldin + watches/science/sports auction
    # APIs) — 15 min was cutting it close, so give it real headroom
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # R2 is the data store of record (bucket lectr-data). Pull the previous
      # corpus so enrichment/firstSeen/bid history carry forward — the guard
      # inside data-store.sh keeps whichever copy (git checkout vs R2) is
      # newer, so this is safe during the git→R2 transition.
      - name: Pull previous data from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull

      - name: Run crawler
        run: npx tsx scripts/ray-crawl.ts

      # Derived payloads are rebuilt as explicit steps AFTER the crawl and
      # BEFORE the commit — a bug in either builder fails the job loudly here
      # instead of committing partial data.
      - name: Rebuild the eager upcoming payload
        run: npx tsx scripts/build-upcoming.ts

      - name: Rebuild the point-in-time backtest
        run: npx tsx scripts/build-backtest.ts

      # Publish the night's data to R2 (latest + dated corpus snapshot).
      # WARN-only while the CI token is still Pages-scoped — once it carries
      # R2 Edit and a green run lands, the git commit below gets removed and
      # this becomes the sole publish path (fail loud then).
      - name: Push data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/data-store.sh push || \
            echo "::warning::R2 push failed — the CI token likely lacks Workers R2 Storage: Edit. Data shipped via git this run."

      # Mirror the corpus into the Supabase lots table (permalink fast path).
      # Skips silently when the secrets are absent; the site works off shards.
      - name: Sync lots table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync-lots-db.ts

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # commit BOTH the served payloads AND the source-of-truth corpus —
          # without data/corpus the gzipped corpus reverts to the last manual
          # commit every run: enrichment is re-burned, firstSeen lies, and the
          # sold-archive tail can silently regress.
          git add public/data/ray/ data/corpus/
          git diff --staged --quiet && echo "no data changes" && exit 0
          # keep a copy of the freshly built artifacts — the conflict-recovery
          # path below hard-resets the worktree, which would wipe them
          cp -R public/data/ray "$RUNNER_TEMP/ray-data"
          cp -R data/corpus "$RUNNER_TEMP/ray-corpus"
          git commit -m "chore(ray): update auction data"
          # the crawl takes ~15 min — if anything landed on main meanwhile,
          # rebase our data commit on top and retry rather than fail. A clean
          # rebase only covers the pure push race: if the concurrent push
          # touched public/data/ray/ (a local RAY_ONLY onboarding run), the
          # rebase conflicts and is left IN PROGRESS, so blind retries would
          # fail all 5 times and drop the day's crawl (Goldin bid snapshots —
          # the future hammers — included). On failure: abort any half-done
          # rebase, reset to origin/main, re-apply the built artifacts on
          # top, and re-commit before the next attempt.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i rejected, recovering…"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rm -rf public/data/ray data/corpus
            cp -R "$RUNNER_TEMP/ray-data" public/data/ray
            cp -R "$RUNNER_TEMP/ray-corpus" data/corpus
            git add public/data/ray/ data/corpus/
            if git diff --staged --quiet; then echo "no data changes after reset"; exit 0; fi
            git commit -m "chore(ray): update auction data"
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1

      # Deploy the fresh data ourselves: pushes made with the default
      # GITHUB_TOKEN never trigger deploy.yml (GitHub's loop prevention), so
      # without this step a night's crawl commits but prod serves stale data
      # until the next human push (observed Jul 18: two crawls, zero deploys).
      - name: Build site with fresh data
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no CF token — skipping deploy"; exit 0; fi
          npx wrangler pages deploy out --project-name collectr --branch main --commit-dirty=true
