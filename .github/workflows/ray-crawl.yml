name: Ray - Crawl Auction Data (monolith — manual fallback)

# SUPERSEDED by nightly.yml (the staged, segmented, bulletproof pipeline). This
# is the old single-job monolith: pull full corpus → crawl every house → build
# → deploy in one job. Kept as a MANUAL fallback (workflow_dispatch only — no
# cron, so it never double-fires with nightly.yml). It writes the full corpus
# (data/corpus/{lots,sold-archive}.json.gz) directly, which the segmented
# pipeline can re-bootstrap from. Use only if the staged pipeline is wedged.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOTHEBYS_COOKIE: ${{ secrets.SOTHEBYS_COOKIE }}
  # the crawl loads the whole ~455k-lot corpus into memory (lotMap + allLots +
  # the engine pass) and OOM'd on Node's default ~2GB heap (exit 134). Runners
  # have 16GB — give node 10GB. Applies to every tsx/next step in the job.
  NODE_OPTIONS: --max-old-space-size=10240

jobs:
  crawl:
    runs-on: ubuntu-latest
    # the crawl grew ~4x (Goldin sports cards + culture backlog → 455k corpus)
    # and now does pull→crawl→rebuild→push→sync→build→deploy in one job. It was
    # silently hitting the old 45min cap (a nightly ran 45m22s then got KILLED,
    # leaving prod stale), plus the R2 GET-lag pull-wait can add minutes. Give
    # it real headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # R2 is the data store of record (bucket lectr-data). Pull the previous
      # corpus so enrichment/firstSeen/bid history carry forward — the guard
      # inside data-store.sh keeps whichever copy (git checkout vs R2) is
      # newer, so this is safe during the git→R2 transition.
      - name: Pull previous data from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull

      - name: Run crawler
        run: npx tsx scripts/ray-crawl.ts

      # Derived payloads are rebuilt as explicit steps AFTER the crawl and
      # BEFORE the commit — a bug in either builder fails the job loudly here
      # instead of committing partial data.
      - name: Rebuild the eager upcoming payload
        run: npx tsx scripts/build-upcoming.ts

      - name: Rebuild the point-in-time backtest
        run: npx tsx scripts/build-backtest.ts

      # Publish the night's data to R2 (latest + dated corpus snapshot).
      # This is the SOLE publish path — data is not committed to git — so a
      # failed push fails the job loudly before the deploy ships anything.
      - name: Push data to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push

      # Mirror the corpus into the Supabase lots table (permalink fast path).
      # Skips silently when the secrets are absent; the site works off shards.
      - name: Sync lots table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync-lots-db.ts

      # Match tonight's new lots against every saved search → alert rows
      - name: Match saved-search alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/match-alerts.ts

      # Email each user their fresh matches — one digest per night. Skips
      # silently until RESEND_API_KEY is provisioned (in-app inbox unaffected).
      - name: Send alert digests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: npx tsx scripts/send-digest.ts

      # Deploy the fresh data ourselves — no git commit happens, so only this
      # workflow can put the night's crawl in front of users.
      - name: Build site with fresh data
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no CF token — skipping deploy"; exit 0; fi
          npx wrangler pages deploy out --project-name collectr --branch main --commit-dirty=true
