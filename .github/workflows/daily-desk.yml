# THE DAILY DESK EMAIL (Oct 21 2026) — the morning send of each opted-in
# reader's own desk (scripts/daily-desk-send.ts; opt-in table + recipients RPC
# in supabase/migrations/0011). Runs after the nightly has settled results and
# the morning close board has refreshed bids. Inert until RESEND_API_KEY is set
# (renders and logs only); once a day per reader (email_prefs.last_sent_on +
# a Resend idempotency key), so a manual re-run never double-sends.
#
# Manual runs (Oct 29): `only` = one recipient's address (or user id) and
# `force` = send even if that reader was already sent today — the owner can
# mail himself a real edition to review. `dry_run` sends nothing and uploads
# the rendered editions (<user_id>.html + .txt) as the daily-desk-preview
# artifact for three days, so a real-data edition can be read without
# Supabase access locally. A scheduled run never uploads a preview: a
# rendered email is a reader's private desk.
name: Daily Desk email
on:
  schedule:
    # 12:20 UTC = 8:20 New York (EDT) / 7:20 (EST)
    - cron: '20 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and log only — send nothing; upload the renders as the daily-desk-preview artifact'
        type: boolean
        default: false
      force:
        description: 'Send even to a reader already sent today (last_sent_on)'
        type: boolean
        default: false
      only:
        description: 'One recipient only — their email address or user id'
        type: string
        default: ''
concurrency:
  group: daily-desk
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Send the Daily Desk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAILY_DESK_FROM: ${{ vars.DAILY_DESK_FROM || 'lectr <desk@lectr.bid>' }}
          DD_ONLY: ${{ inputs.only }}
        run: >
          npx tsx scripts/daily-desk-send.ts
          ${{ inputs.dry_run && '--dry-run --preview-dir out/daily-desk' || '' }}
          ${{ inputs.force && '--force' || '' }}
          ${DD_ONLY:+--only "$DD_ONLY"}
      - name: Upload the dry-run renders
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-desk-preview
          path: out/daily-desk
          retention-days: 3
          if-no-files-found: warn
