# CLOSE-DAY BOARD — the intraday leg of the engine's timeliness fix. Refreshes
# current bids for lots closing <24h (Goldin API passes + REA lot pages),
# re-projects with the served close curve, and DEPLOYS the overlay directly.
# Corpus untouched.
#
# Sep 27 2026: this used to commit public/data/ray/close-board.json to main
# and rely on deploy.yml's `on: push` — but a push made with GITHUB_TOKEN never
# triggers another workflow, so the overlay only went live with the next
# nightly (no close-board deploy since Sep 19). Now the job hands the overlay
# to deploy.yml as a reusable workflow (same guards, same deploy-collectr
# queue as every other production deploy — it never races the nightly).
# Nothing is committed: deploy.yml bakes the newest of {this overlay,
# production's live copy, the nightly's served copy} via
# scripts/ci/seed-close-board.mjs, so later code-push deploys keep it too.
#
# CLOCK (Oct 3 2026): the Cloudflare cron-trigger Worker (workers/cron-trigger)
# dispatches this on the minute at :43 every 4h with trigger=cron-worker. The
# GitHub cron below is the FALLBACK, 20 min later; the guard job skips it when
# a cron-worker run started in the last 3h (no double production deploy).
name: Close board (intraday)
run-name: ${{ format('Close board · {0}', inputs.trigger || github.event_name) }}
on:
  schedule:
    # FALLBACK: 20 min after the Worker's '43 2,6,10,14,18,22' (clear of the
    # 04:17 nightly). Until the Worker is deployed this cron IS the board.
    - cron: '3 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: "'cron-worker' when dispatched by the scheduled Worker; leave 'manual' by hand"
        type: string
        default: manual
concurrency:
  group: close-board
  # never cancel: a newer board must not kill an in-flight production deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.guard.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Double-run guard
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER: ${{ inputs.trigger }}
        run: node scripts/ci/run-guard.mjs --workflow close-board.yml --hours 3 --event "$GITHUB_EVENT_NAME" --trigger "$TRIGGER"
  board:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the overlay
        id: build
        run: |
          rm -f public/data/ray/close-board.json
          RAY_SKIP_MAIN=1 npx tsx scripts/close-board.ts
          if [ -f public/data/ray/close-board.json ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; echo "no overlay built — nothing to deploy"; fi
      # tiny + public (it is served at lectr.bid/data/ray/close-board.json)
      - name: Hand the overlay to the deploy
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: close-board-overlay
          path: public/data/ray/close-board.json
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: board
    if: needs.board.outputs.built == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      close_board_artifact: close-board-overlay
    # inherit: deploy.yml picks CF_R2_READ_TOKEN / CF_PAGES_TOKEN (falling
    # back to CLOUDFLARE_API_TOKEN); its job reads the 'production' environment
    secrets: inherit
