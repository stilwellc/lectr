name: Emit value book (Starling)

# Standalone, manually-triggerable emit of the Starling value book. The nightly
# already runs this as a step; this lets us push a fresh book to private R2
# on demand without a full nightly (crawl + assemble).
on:
  workflow_dispatch:

permissions:
  contents: read

# One emit at a time (queue, never cancel): two overlapping runs would race
# the same private R2 key with whichever finished last winning.
concurrency:
  group: emit-value-book
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=10240

jobs:
  emit:
    runs-on: ubuntu-latest
    # pull (pointer read can lag ~14min worst case) + the emit itself
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull corpus from R2 (last-good)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull
      - name: Emit value book → private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/emit-value-book.ts
