# One-off (re-runnable) MLB Auctions back-crawl: sweeps the ENTIRE closed
# archive the platform still serves (~a year of retention), decides game-used
# on full lot-page titles, and unions into the mlbauction segment on R2 —
# tonight's assemble picks it up via the segment fallback. Dispatch-only.
name: Backfill MLB Auctions (closed archive)
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'max closed pages per sweep (100 rows each)'
        default: '200'
      idskip:
        description: 'idwalk only: skip the first N manifest ids (slice start)'
        default: '0'
      idcap:
        description: 'idwalk only: walk at most N ids this run (0 = all)'
        default: '30000'
      mode:
        description: 'archive = windowed closed sweep · idwalk = deep wayback-id walk'
        type: choice
        options: [archive, idwalk]
        default: 'archive'
concurrency:
  group: segments-mlbauction
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # dispatch inputs reach the shell ONLY through env, validated before use
    env:
      PAGES: ${{ inputs.pages || '200' }}
      IDSKIP: ${{ inputs.idskip || '0' }}
      IDCAP: ${{ inputs.idcap || '30000' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate inputs
        run: |
          for v in PAGES IDSKIP IDCAP; do [[ "${!v}" =~ ^[0-9]+$ ]] || { echo "::error::$v must be a non-negative integer"; exit 1; }; done
      # STRICT pull (no `|| echo` fallback): a failed pull followed by a
      # merge-and-push would publish a sweep-only segment over the real one.
      # A genuinely-absent segment is NOT a failure — pull-segment returns 0
      # ("not in R2 yet") when the bucket listing confirms it.
      - name: Pull last-good segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh pull-segment mlbauction
      - name: Back-crawl closed archive
        if: ${{ (inputs.mode || 'archive') == 'archive' }}
        run: RAY_SKIP_MAIN=1 npx tsx scripts/crawl-mlbauction.ts --backfill --closed-pages "$PAGES" --delay 500 --write
      - name: Deep id-walk (wayback-recovered ids vs the live site)
        if: ${{ inputs.mode == 'idwalk' }}
        run: RAY_SKIP_MAIN=1 npx tsx scripts/crawl-mlbauction.ts --idwalk --closed-pages 0 --delay 400 --idskip "$IDSKIP" --idcap "$IDCAP" --write
      - name: Push segment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/data-store.sh push-segment mlbauction
