# THE SHOT RIG — nightly visual regression of the CODE, on PINNED data.
#
# Builds the site from a frozen served payload (R2 key committed in
# tests/ui-baseline/FIXTURE — `data-store.sh pull-fixture`), serves out/
# locally with `wrangler pages dev` (so _redirects/_headers behave like
# Pages), freezes the browser clock at the fixture's lastCrawl, stubs
# external images, masks [data-volatile] regions, and diffs every frame
# against tests/ui-baseline/. It used to screenshot PROD, so each night's
# data drifted the frames (red 28/28 days, catching nothing).
#
# A missing baseline FAILS (it used to seed itself silently).
# RE-BASELINE ENTIRELY IN CI (Oct 3 2026 — no local R2 token needed):
#   gh workflow run ui-shots.yml -f pin_fixture=true -f approve=true
#     pin      copies the CURRENT published served payload to a write-once
#              fixtures/ui-shots/<version>/ key (data-store.sh pin-fixture,
#              R2 write token, 'production' environment)
#     shots    builds + captures against THAT fixture and writes every frame
#              as the new baseline (CI renders with Linux fonts — approve here)
#     propose  pushes tests/ui-baseline/ (+ FIXTURE) to the branch
#              ui-shots/rebaseline-<run_id> and opens a PR — review the frames
#              in the PR diff, merge it, done.
#   Code-only re-baseline (same data): -f approve=true alone.
# (If the repo forbids Actions from opening PRs, the branch is still pushed
#  and the job prints the compare URL.) docs/RUNBOOK.md "UI-shots re-baseline".
name: ui-shots
on:
  schedule:
    - cron: '37 9 * * *'   # daily; data is pinned, so the hour no longer matters
  workflow_dispatch:
    inputs:
      approve:
        description: 'Approve: write every frame as the new baseline and open a PR with them'
        type: boolean
        default: false
      pin_fixture:
        description: 'Re-pin the data fixture to the CURRENT published payload first (R2 write), then render against it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-shots
  cancel-in-progress: true

jobs:
  pin:
    if: ${{ inputs.pin_fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      key: ${{ steps.pin.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pin the current published payload as the UI fixture
        id: pin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/data-store.sh pin-fixture
          echo "key=$(tr -d '[:space:]' < tests/ui-baseline/FIXTURE)" >> "$GITHUB_OUTPUT"

  shots:
    needs: pin
    # runs when pinning succeeded or was not asked for
    if: ${{ !cancelled() && needs.pin.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned data fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIXTURE_KEY: ${{ needs.pin.outputs.key }}
        # the just-pinned key when pin ran, else the committed tests/ui-baseline/FIXTURE
        run: bash scripts/data-store.sh pull-fixture "$FIXTURE_KEY"
      # no NEXT_PUBLIC_SUPABASE_* → auth stays dormant: no account UI to drift
      - name: Build the site against the fixture
        run: npm run build
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      # --compatibility-date is pinned: without it pages dev uses TODAY, which
      # a pinned wrangler's bundled workerd refuses once today passes its
      # newest supported date (the server then never starts).
      - name: Serve out/ like Pages (wrangler pages dev)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          nohup npx wrangler@4.120.1 pages dev out --port 8788 --ip 127.0.0.1 --show-interactive-dev-session=false --compatibility-date=2026-08-01 > "$RUNNER_TEMP/pages-dev.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/; then echo "pages dev up"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pages-dev.log"; echo "::error::wrangler pages dev did not come up"; exit 1
      - name: Capture + diff
        env:
          BASE_URL: http://127.0.0.1:8788
          SHOT_OFFLINE: '1'
          APPROVE: ${{ inputs.approve && '1' || '0' }}
        run: |
          # freeze the page clock one hour after the fixture's crawl
          SHOT_NOW=$(node -e 'const m=require("./public/data/ray/meta.json");const t=Date.parse(m.lastCrawl);if(!t)process.exit(1);console.log(new Date(t+3600e3).toISOString())')
          export SHOT_NOW
          echo "clock frozen at $SHOT_NOW"
          if [ "$APPROVE" = "1" ]; then node scripts/ui-shots.mjs --approve; else node scripts/ui-shots.mjs; fi
      - name: Upload approved baselines
        if: ${{ inputs.approve }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-baseline
          path: tests/ui-baseline/
          retention-days: 14
      - name: Upload diffs + captures on drift
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-drift
          path: |
            shots/diff/
            shots/current/
          retention-days: 14
          if-no-files-found: ignore

  # Commit the approved frames (+ the new FIXTURE) to a branch and open a PR —
  # the only job with write scopes, and only on a deliberate dispatch.
  propose:
    needs: [pin, shots]
    if: ${{ !cancelled() && (needs.pin.result == 'success' || (inputs.approve && needs.shots.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the approved baselines
        if: ${{ inputs.approve && needs.shots.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ui-baseline
          path: tests/ui-baseline
      - name: Record the pinned fixture
        if: ${{ needs.pin.result == 'success' }}
        env:
          KEY: ${{ needs.pin.outputs.key }}
        run: printf '%s\n' "$KEY" > tests/ui-baseline/FIXTURE
      - name: Push a branch + open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ inputs.approve && needs.shots.result == 'success' }}
          KEY: ${{ needs.pin.outputs.key }}
        run: |
          if git diff --quiet -- tests/ui-baseline && [ -z "$(git ls-files --others --exclude-standard tests/ui-baseline)" ]; then
            echo "nothing changed under tests/ui-baseline — no PR"; exit 0
          fi
          branch="ui-shots/rebaseline-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/ui-baseline
          what="re-baseline"
          if [ -n "$KEY" ]; then what="pin fixture ${KEY} + re-baseline"; fi
          git commit -m "ui-shots: ${what}"
          git push origin "$branch"
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · fixture: ${KEY:-unchanged} · baselines approved: ${APPROVED}"
          if [ "$APPROVED" != "true" ]; then body="${body} — WARNING: the fixture moved but the baselines were NOT re-approved; dispatch again with approve=true before merging."; fi
          gh pr create --base main --head "$branch" --title "ui-shots: ${what}" --body "$body" \
            || echo "::warning title=PR not opened::Actions may not be allowed to open PRs here — open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}"
