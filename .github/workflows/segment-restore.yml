# SEGMENT RESTORE — roll ONE house's last-good segment back to a version from
# the write-once ladder (segment-versions/<house>/), under that house's
# segment lock so no crawl/heal/backfill can interleave.
#
#   gh workflow run segment-restore.yml -f house=hakes -f date=2026-10-01
#   gh workflow run segment-restore.yml -f house=hakes -f date=2026-10-01 -f publish=true
#
# The segment it replaces is itself versioned first (…-prerestore), so a
# restore can be undone the same way. publish=true then dispatches an
# assemble-only nightly (skip_crawl) so the site serves the restored data now.
# docs/RUNBOOK.md "Roll a house back".
name: Segment restore
on:
  workflow_dispatch:
    inputs:
      house:
        description: 'house (segment key, e.g. hakes)'
        type: string
        required: true
      date:
        description: 'version date YYYY-MM-DD, or a full stamp from list-segment-versions'
        type: string
        required: true
      publish:
        description: 'then run an assemble-only nightly (skip_crawl) to publish it'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # THE SEGMENT LOCK shared with every writer of latest/segments/<house>
    # (nightly crawl legs, heals, backfills — docs/data-pipeline.md)
    concurrency:
      group: segments-${{ inputs.house }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write   # only to dispatch the publish run
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate inputs
        env:
          HOUSE: ${{ inputs.house }}
        run: |
          [[ "$HOUSE" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::bad house '$HOUSE'"; exit 1; }
      - name: Restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_WRITE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOUSE: ${{ inputs.house }}
          WHEN: ${{ inputs.date }}
        run: |
          bash scripts/data-store.sh list-segment-versions "$HOUSE"
          bash scripts/data-store.sh restore-segment "$HOUSE" "$WHEN"
      - name: Publish it (assemble-only nightly)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" -f skip_crawl=true
