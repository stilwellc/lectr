name: Social (X + Instagram)

# The social desk, on demand. The nightly runs the same two scripts on its own
# schedule (see nightly.yml → deploy: "Render tonight's social cards", then
# the `social` job). This workflow exists so a human can:
#
#   • preview  — dry_run=true (the default): render tonight's cards + copy,
#                post nothing, upload the JPEGs and today.json as an artifact
#   • force    — pick a post type instead of the weekday rotation
#   • recover  — dry_run=false re-runs a post the nightly missed; the R2
#                ledger makes it idempotent, so a re-run only fills the gap
#
# A live Instagram publish needs the card to be reachable at lectr.bid/social/,
# which only the deploy job guarantees. A manual dry run never needs that.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render and print the copy, post nothing'
        type: boolean
        default: true
      type:
        description: 'Force a post type (blank = weekday rotation)'
        type: choice
        default: ''
        options: ['', 'call', 'receipt', 'index', 'record']

permissions:
  contents: read

concurrency:
  group: social
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Pull the served payload from R2
        run: bash scripts/data-store.sh pull
      - name: Render tonight's cards
        run: npx tsx scripts/social/render.tsx ${{ inputs.type != '' && format('--type={0}', inputs.type) || '' }}
      - name: Post
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npx tsx scripts/social/post.ts
      - name: Keep the cards for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-cards
          path: public/social/
          retention-days: 14
